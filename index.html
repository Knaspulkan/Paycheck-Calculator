<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lönekalkylator</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lönekalkylator">
  <meta name="theme-color" content="#0b1120">
  <link id="manifest-placeholder" rel="manifest">

  <style>
    :root {
      --bg: #0b1120;
      --card: #182234;
      --border: #2c3a50;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --tax-color: #ef4444;
      --aga-color: #3b82f6;
      --pension-color: #a855f7;
      --danger: #ef4444;
      --input-bg: #0d1527;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 6px; padding-bottom: 90px; }
    
    .container { max-width: 900px; margin: 0 auto; }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .auth-wrap { max-width: 340px; margin: 40px auto; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .auth-wrap h2 { font-size: 1.2rem; margin-bottom: 12px; text-align: center; }
    .auth-field { margin-bottom: 10px; }
    .auth-field label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .auth-btn { width: 100%; padding: 9px; background: var(--accent); color: white; border: none; border-radius: 7px; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .auth-switch { text-align: center; margin-top: 12px; font-size: 0.8rem; color: var(--muted); cursor: pointer; text-decoration: underline; }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; margin-bottom: 8px; }
    .user-info { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
    .btn-small { background: #243046; color: var(--text); border: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 0.72rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .btn-small:hover { background: #334155; }
    .btn-small:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-admin { background: #6366f1; }
    
    .backup-bar { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; background: rgba(255,255,255,0.015); border: 1px dashed var(--border); border-radius: 6px; padding: 6px 8px; }
    .backup-row { display: flex; justify-content: space-between; align-items: center; }
    .backup-bar span { font-size: 0.72rem; color: var(--muted); }
    .backup-actions { display: flex; gap: 4px; }

    .month-bar { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 8px; }
    .month-controls { display: flex; gap: 6px; align-items: center; flex: 1; }
    .btn-month { background: var(--accent); color: white; border: none; padding: 5px 9px; border-radius: 5px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .dashboard-center { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; }
    .donut-wrapper { position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .donut-inner-text { position: absolute; text-align: center; pointer-events: none; }
    .donut-inner-text small { display: block; font-size: 0.58rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .donut-inner-text strong { display: block; font-size: 0.92rem; color: var(--accent); font-weight: 800; line-height: 1.1; margin-top: 2px; }

    .stacked-metrics { display: flex; flex-direction: column; gap: 4px; min-width: 190px; flex: 1; max-width: 420px; }
    .metric-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 7px; background: rgba(0,0,0,0.2); border-radius: 4px; border-left: 3px solid transparent; }
    .metric-row.aga { border-color: var(--aga-color); }
    .metric-row.brutto { border-color: var(--muted); }
    .metric-row.pension { border-color: var(--pension-color); }
    .metric-row.skatt { border-color: var(--tax-color); }
    .metric-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }
    .metric-val { font-size: 0.8rem; font-weight: 700; }

    .settings-panel { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; }
    .settings-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .settings-panel label { color: var(--muted); margin-right: 2px; }
    
    .section-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
    .section-header { 
      padding: 6px 8px; 
      background: rgba(255,255,255,0.02); 
      border-bottom: 1px solid var(--border); 
      font-size: 0.8rem; 
      font-weight: 700; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .section-badge { font-size: 0.65rem; padding: 2px 5px; border-radius: 3px; font-weight: 600; }
    .badge-tabell { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .badge-onetime { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .badge-benefit { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
    .badge-deduct { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .badge-neutral { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }

    /* --- EN-RADS-LAYOUT (MED KRYSSRUTA) --- */
    .row-grid {
      display: grid;
      /* Checkbox(22px) | Beskrivning(1fr) | Antal(38px) | Á-pris(60px) | Summa(70px) */
      grid-template-columns: 22px minmax(95px, 1fr) 38px 60px 70px;
      gap: 5px;
      padding: 5px 6px;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      background: var(--card);
      transition: background 0.1s;
    }
    .row-grid.selected-row {
      background: rgba(16, 185, 129, 0.08);
    }
    .row-header {
      font-size: 0.62rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      background: rgba(0,0,0,0.25);
      padding: 4px 6px;
    }

    /* Checkbox anpassad för klick & touch */
    .row-checkbox {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: var(--accent);
      margin: 0 auto;
    }

    input, select { 
      background: var(--input-bg); 
      border: 1px solid var(--border); 
      color: var(--text); 
      border-radius: 4px; 
      padding: 5px 4px; 
      font-size: 0.78rem; 
      width: 100%; 
      outline: none; 
      min-width: 0;
    }
    input:focus { border-color: var(--accent); }
    input[type="number"] { text-align: right; }

    .col-sum { text-align: right; font-weight: 700; font-size: 0.78rem; white-space: nowrap; overflow: hidden; }
    .btn-add { font-size: 0.75rem; color: var(--accent); font-weight: 600; background: none; border: none; cursor: pointer; padding: 7px 10px; width: 100%; text-align: left; }
    .btn-add:hover { background: rgba(16,185,129,0.05); }

    /* --- FLYTANDE ÅTGÄRDSLIST VID MARKERING --- */
    .batch-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border: 1px solid var(--accent);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      border-radius: 25px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      animation: popIn 0.2s ease-out;
    }
    @keyframes popIn {
      from { transform: translate(-50%, 20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .batch-count { font-size: 0.75rem; font-weight: 700; color: var(--accent); margin-right: 4px; white-space: nowrap; }
    .batch-btn {
      background: #334155;
      color: var(--text);
      border: none;
      border-radius: 15px;
      padding: 5px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .batch-btn:hover { background: #475569; }
    .batch-btn.danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .batch-btn.danger:hover { background: var(--danger); color: white; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div id="authView" class="auth-wrap">
      <h2 id="authTitle">Logga in</h2>
      <div class="auth-field">
        <label>Användarnamn</label>
        <input type="text" id="usernameInput" placeholder="Användarnamn" onkeydown="if(event.key==='Enter') handleAuthSubmit()">
      </div>
      <div class="auth-field">
        <label>Lösenord</label>
        <input type="password" id="passwordInput" onkeydown="if(event.key==='Enter') handleAuthSubmit()">
      </div>
      <button class="auth-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">Logga in</button>
      <div class="auth-switch" id="authToggleText" onclick="toggleAuthMode()">Inget konto? Skapa användare här</div>
    </div>

    <div id="appView" class="hidden">
      <div class="app-header">
        <h1 style="font-size: 1.05rem;">Lönekalkylator</h1>
        <div class="user-info">
          <button class="btn-small" id="undoBtn" onclick="undoAction()" disabled title="Ångra senaste ändringen">↩ Ångra</button>
          <span id="currentUserLabel"></span>
          <button class="btn-small" onclick="logout()">Logga ut</button>
        </div>
      </div>

      <div class="backup-bar">
        <div class="backup-row">
          <span>Min säkerhetskopia</span>
          <div class="backup-actions">
            <button class="btn-small" onclick="exportUserData()">Spara</button>
            <button class="btn-small" onclick="document.getElementById('importFileInput').click()">Återställ</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importUserData(event)">
          </div>
        </div>
        <div class="backup-row" id="adminBackupRow" style="display:none; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px;">
          <span style="color: #818cf8; font-weight: 600;">Admin: Hela databasen</span>
          <div class="backup-actions">
            <button class="btn-small btn-admin" onclick="exportAllUsers()">Exportera alla</button>
            <button class="btn-small btn-admin" onclick="document.getElementById('adminImportFileInput').click()">Importera alla</button>
            <input type="file" id="adminImportFileInput" accept=".json" style="display:none" onchange="importAllUsers(event)">
          </div>
        </div>
      </div>

      <div class="month-bar">
        <div class="month-controls">
          <label for="monthSelect" style="font-size: 0.76rem; color: var(--muted);">Månad:</label>
          <select id="monthSelect" onchange="changeMonth(this.value)" style="max-width: 110px;"></select>
        </div>
        <button class="btn-month" onclick="createNewMonth()">+ Ny månad</button>
      </div>

      <div class="settings-panel">
        <div class="settings-row">
          <div style="flex: 1; min-width: 190px; display:flex; gap: 4px; align-items:center;">
            <label>Avtal:</label>
            <select id="agreementSelect" onchange="applyAgreementTemplate(this.value)" style="flex:1;">
              <option value="teknik
